version: '3'

services:
  backend:
    build:
      context: .
      dockerfile: Server/Dockerfile
    container_name: legalmind-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: legalmind-frontend
    ports:
      - "80:80"
    restart: always
